<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Double Take Dash</title>
<style>
canvas {
  border:3px solid #fff;
  image-rendering: pixelated;
  background: #d2a86b; /* basketball court color */
  display:block;
  margin:auto;
}
button {
  display:block;
  margin:auto;
  padding:10px 20px;
  font-size:20px;
  cursor:pointer;
  background:#fff;
  border:2px solid #000;
  border-radius:5px;
}
</style>
</head>
<body>

<canvas id="game" width="512" height="512"></canvas>
<button id="playButton">Play</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Make canvas focusable
canvas.setAttribute('tabindex','0');
canvas.focus();
canvas.addEventListener('click', () => { canvas.focus(); });

// Game scaling
const scale = 32;
const rows = canvas.height / scale;
const cols = canvas.width / scale;

// Game state
let state = 'menu'; // menu, countdown, playing, gameover
let countdown = 3;

// Player
let player = { x: Math.floor(cols/2), y: rows - 2 };
let lives = 3;
let score = 0;

// Obstacles and bonuses
let obstacles = [];
let bonuses = [];
let extraLives = [];

// Movement
let left=false, right=false;
canvas.addEventListener('keydown', e => {
    if(state==='playing'){
        if(e.key==='ArrowLeft') left=true;
        if(e.key==='ArrowRight') right=true;
    }
});
canvas.addEventListener('keyup', e => {
    if(state==='playing'){
        if(e.key==='ArrowLeft') left=false;
        if(e.key==='ArrowRight') right=false;
    }
});

// Start countdown and play
const playButton = document.getElementById('playButton');
playButton.addEventListener('click', () => {
    if(state==='menu' || state==='gameover'){
        state='countdown';
        countdown=3;
        playButton.style.display='none';
        setTimeout(countdownTick, 1000);
    }
});

function countdownTick(){
    countdown--;
    if(countdown>0){
        setTimeout(countdownTick,1000);
    } else {
        state='playing';
        spawnTimers();
    }
}

// Spawn bonuses and extra lives
function spawnTimers(){
    setInterval(()=>{ // bonus spawn
        if(state==='playing' && Math.random()<0.1){
            bonuses.push({x:Math.floor(Math.random()*cols), y:0});
        }
    }, 2000);

    setInterval(()=>{ // heart spawn
        if(state==='playing' && Math.random()<0.05){
            extraLives.push({x:Math.floor(Math.random()*cols), y:0});
        }
    }, 5000);
}

// Update game
function update(){
    if(state!=='playing') return;

    if(left && player.x>0) player.x--;
    if(right && player.x<cols-1) player.x++;

    if(Math.random() < 0.05) { // obstacles spawn
        obstacles.push({x: Math.floor(Math.random()*cols), y:0});
    }

    // Move obstacles
    for(let i=obstacles.length-1;i>=0;i--){
        obstacles[i].y++;
        if(obstacles[i].y===player.y && obstacles[i].x===player.x){
            lives--;
            obstacles.splice(i,1);
            if(lives<=0) state='gameover';
        } else if(obstacles[i].y>rows){
            obstacles.splice(i,1);
        }
    }

    // Move bonuses
    for(let i=bonuses.length-1;i>=0;i--){
        bonuses[i].y++;
        if(bonuses[i].y===player.y && bonuses[i].x===player.x){
            score+=50;
            bonuses.splice(i,1);
        } else if(bonuses[i].y>rows){
            bonuses.splice(i,1);
        }
    }

    // Move extra lives
    for(let i=extraLives.length-1;i>=0;i--){
        extraLives[i].y++;
        if(extraLives[i].y===player.y && extraLives[i].x===player.x){
            if(lives<3) lives++;
            extraLives.splice(i,1);
        } else if(extraLives[i].y>rows){
            extraLives.splice(i,1);
        }
    }

    score++;
}

// Draw everything
function draw(){
    // Clear
    ctx.fillStyle = '#d2a86b';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    if(state==='menu'){
        ctx.fillStyle='#000';
        ctx.font='48px monospace';
        ctx.fillText('The Double Take Dash', canvas.width/2-200, canvas.height/2-50);
        playButton.style.display='block';
    }
    else if(state==='countdown'){
        ctx.fillStyle='#000';
        ctx.font='72px monospace';
        ctx.fillText(countdown, canvas.width/2-20, canvas.height/2);
    }
    else if(state==='playing' || state==='gameover'){
        // Court line
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height/2);
        ctx.lineTo(canvas.width, canvas.height/2);
        ctx.stroke();

        // Player
        let px = player.x*scale;
        let py = player.y*scale;

        // Head
        ctx.fillStyle = '#ffeb3b';
        ctx.fillRect(px+8, py, 16, 16);

        // Jacket
        ctx.fillStyle = '#000';
        ctx.fillRect(px+4, py+16, 24, 24);

        // Shirt
        ctx.fillStyle = '#0f0';
        ctx.fillRect(px+6, py+20, 20, 16);

        // Pants
        ctx.fillStyle = '#333';
        ctx.fillRect(px+8, py+40, 16, 16);

        // Shoes
        ctx.fillStyle = '#964B00';
        ctx.fillRect(px+8, py+56, 16, 8);

        // Microphone
        ctx.fillStyle = '#666';
        ctx.fillRect(px+24, py+30, 4, 8);
        ctx.fillStyle = '#ccc';
        ctx.fillRect(px+24, py+24, 8, 8);
        ctx.fillStyle = '#000';
        ctx.font='6px monospace';
        ctx.fillText('LSN', px+24, py+30);

        // Obstacles
        obstacles.forEach(o=>{
            let ox=o.x*scale; let oy=o.y*scale;
            ctx.fillStyle='#fff';
            ctx.beginPath();
            ctx.arc(ox+scale/2, oy+scale/2, scale/2-2,0,Math.PI*2);
            ctx.fill();
            ctx.strokeStyle='#ccc';
            ctx.lineWidth=1;
            ctx.beginPath();
            ctx.moveTo(ox+4, oy+scale/2);
            ctx.lineTo(ox+scale-4, oy+scale/2);
            ctx.moveTo(ox+scale/2, oy+4);
            ctx.lineTo(ox+scale/2, oy+scale-4);
            ctx.stroke();
        });

        // Bonuses
        bonuses.forEach(b=>{
            let bx=b.x*scale; let by=b.y*scale;
            ctx.fillStyle='#ff0';
            ctx.fillRect(bx+8, by+8,16,16);
            ctx.fillStyle='#000';
            ctx.font='6px monospace';
            ctx.fillText('COOL', bx+8, by+14);
            ctx.fillText('BONUS', bx+8, by+20);
        });

        // Extra lives
        for(let i=0;i<lives;i++){
            ctx.fillStyle='red';
            ctx.beginPath();
            let hx=10+i*20, hy=40;
            ctx.moveTo(hx+5, hy+5);
            ctx.arc(hx+5, hy+5,5,0,Math.PI*2);
            ctx.fill();
        }

        // Score
        ctx.fillStyle='#fff';
        ctx.font='24px monospace';
        ctx.fillText('Score: '+score,10,30);

        if(state==='gameover'){
            ctx.fillStyle='#fff';
            ctx.font='32px monospace';
            ctx.fillText('GAME OVER', canvas.width/2-100, canvas.height/2);
            playButton.style.display='block';
        }
    }
}

// Restart
canvas.addEventListener('keydown', e=>{
    if((e.key==='r'||e.key==='R') && state==='gameover'){
        restartGame();
    }
});

function restartGame(){
    state='menu';
    obstacles=[];
    bonuses=[];
    extraLives=[];
    lives=3;
    score=0;
}

// Game loop
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
